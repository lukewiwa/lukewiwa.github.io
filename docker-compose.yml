services:
  app:
    container_name: blog-django
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    environment:
      - DEBUG=true
      - DEBUG_TOOLBAR_ENABLED=true
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=localhost,
      - DOMAIN=localhost
      - ROOT_URLCONF=config.urls.debug

      - INITIAL_SUPERUSER_USERNAME=${INITIAL_SUPERUSER_USERNAME}
      - INITIAL_SUPERUSER_PASSWORD=${INITIAL_SUPERUSER_PASSWORD}
      - INITIAL_SUPERUSER_EMAIL=${INITIAL_SUPERUSER_EMAIL}

      - CSRF_COOKIE_NAME=wiwablogcsrftoken
      - CSRF_COOKIE_SECURE=false
      - CSRF_COOKIE_HTTPONLY=false
      - SESSION_COOKIE_NAME=wiwablogsessionid
      - SESSION_COOKIE_SECURE=false
      - SESSION_COOKIE_HTTPONLY=false

      # SQLite on local disk, replicated to RustFS by Litestream. Comment out
      # LITESTREAM_REPLICA_URL to run against a purely local database.
      - DB_PATH=/tmp/db.sqlite3
      - LITESTREAM_CONFIG=/function/litestream.yml
      - LITESTREAM_SOCKET=/tmp/litestream.sock
      - LITESTREAM_REPLICA_URL=s3://${SQLITE_OBJECT_STORAGE_BUCKET_NAME:-wiwablogdb}/db
      - LITESTREAM_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-localdev}
      - LITESTREAM_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-localdevsecret}
      - LITESTREAM_S3_ENDPOINT=http://localhost:${S3_PORT:-9000}
      - LITESTREAM_S3_FORCE_PATH_STYLE=true

      # Publishing. The same S3 target as production, pointed at RustFS.
      - BUILD_DIR=/tmp/build
      - PUBLISH_TARGET=${PUBLISH_TARGET:-s3}
      - PUBLISH_RUNNER=inline
      - PUBLISH_BUCKET_NAME=${PUBLISH_BUCKET_NAME:-wiwa-site}
      - PUBLISH_ENDPOINT_URL=http://localhost:${S3_PORT:-9000}
      - PUBLISH_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-localdev}
      - PUBLISH_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-localdevsecret}

      - MEDIA_BACKEND=s3
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-wiwablog}
      - AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-localdev}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-localdevsecret}
      - AWS_S3_ENDPOINT_URL=http://localhost:${S3_PORT:-9000} # local mock S3 container

      # CDK deployment
      - AWS_ACCESS_KEY_ID=${AWS_CDK_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_CDK_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-2}
      - FULLY_QUALIFIED_DOMAIN=${FULLY_QUALIFIED_DOMAIN}
      - SUB_DOMAIN=${SUB_DOMAIN}

    volumes:
      - .:/function
      - node_modules-cache:/function/src/node_modules

    entrypoint: /function/entrypoint.sh
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    ports:
      - "${DJANGO_PORT:-8000}:8000"
      - "${S3_PORT:-9000}:${S3_PORT:-9000}"
      - "${S3_UI_PORT:-9001}:${S3_UI_PORT:-9001}"

  s3:
    container_name: blog-s3
    # Pinned: RustFS is pre-1.0, so let upgrades be a deliberate change.
    image: rustfs/rustfs:1.0.0-beta.12
    network_mode: service:app
    depends_on:
      - app
    environment:
      - RUSTFS_ACCESS_KEY=${AWS_S3_ACCESS_KEY_ID:-localdev}
      - RUSTFS_SECRET_KEY=${AWS_S3_SECRET_ACCESS_KEY:-localdevsecret}
      - RUSTFS_ADDRESS=0.0.0.0:${S3_PORT:-9000}
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:${S3_UI_PORT:-9001}
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_VOLUMES=/data
      - RUSTFS_OBS_LOGGER_LEVEL=error
    volumes:
      - blog-s3-data:/data
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:${S3_PORT:-9000}/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  s3-create-buckets:
    container_name: blog-s3-create-buckets
    image: public.ecr.aws/aws-cli/aws-cli:2.16.0
    depends_on:
      # Litestream errors rather than starting clean if its bucket is missing,
      # so wait for RustFS to answer before creating them.
      s3:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID:-localdev}
      - AWS_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY:-localdevsecret}
      - AWS_S3_ENDPOINT_URL=http://app:${S3_PORT:-9000}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-wiwablog}
      - SQLITE_OBJECT_STORAGE_BUCKET_NAME=${SQLITE_OBJECT_STORAGE_BUCKET_NAME:-wiwablogdb}
      - SQLITE_OBJECT_STORAGE_ENDPOINT_URL=http://app:${S3_PORT:-9000}
      - PUBLISH_BUCKET_NAME=${PUBLISH_BUCKET_NAME:-wiwa-site}
    volumes:
      - ./create-buckets-command.sh:/opt/command/create-buckets-command.sh
    entrypoint: "bash"
    command: /opt/command/create-buckets-command.sh

volumes:
  blog-s3-data: null
  node_modules-cache: null
